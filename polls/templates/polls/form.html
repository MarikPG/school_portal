{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{{ question.question_text }}</h2>

    <p><strong>Всього голосів: {{ total_votes }}</strong></p>

    {% for option in options %}
        <div class="mb-4">
            <div>
                <strong>{{ option.text }}</strong> — {{ option.vote_count }} голосів ({{ option.percentage }}%)
            </div>
            <div style="background: #ddd; width: 100%; height: 25px; margin-top: 5px;">
                <div style="background: #0d6efd; width: calc({{ option.percentage }} * 1%); height: 25px;"></div>
            </div>
        </div>
    {% empty %}
        <p>Голосів ще немає.</p>
    {% endfor %}

    <a href="{% url 'polls:list' %}" class="btn btn-secondary mt-3">Назад до списку</a>
</div>
{% endblock %}
