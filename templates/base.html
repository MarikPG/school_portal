<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Сайт {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'forum:index' %}">School Portal</a>
        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-light">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Вийти</button>
                </form>
            {% else %}
                <a class="text-light" href="{% url 'forum:signup' %}">Реєстрація</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Увійти</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container mt-4">
    {% if messages %}
        {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
    {% endif %}
    {% block content %}

    <!-- Контент -->
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
