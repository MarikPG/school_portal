{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Вхід</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Увійти</button>
        </form>
        <p class="text-center mt-3">
            Ще не маєте акаунта? <a href="{% url 'register' %}">Зареєструватися</a>
        </p>
    </div>
</div>
{% endblock %}
