{% for thread in threads %}
<article class="card mb-3 shadow-sm">
    <div class="card-body">
        <h2 class="h5"><a href="{% url 'forum:thread_detail' thread.id %}">{{ thread.title }}</a></h2>
        <p>{{ thread.content|truncatewords:30 }}</p>
        <small class="text-muted">{{ thread.user.username }} · {{ thread.updated_at|date:'d.m.Y H:i' }} · {{ thread.posts.count }} відповідей</small>
    </div>
</article>
{% empty %}<div class="alert alert-secondary">Тем ще немає.</div>{% endfor %}
