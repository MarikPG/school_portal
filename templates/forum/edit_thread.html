{% extends 'base.html' %}{% block title %}Редагування теми{% endblock %}{% block content %}<h1>Редагування теми</h1><form method="post" class="card card-body">{% csrf_token %}<label class="form-label" for="title">Заголовок</label><input class="form-control mb-3" id="title" name="title" value="{{ thread.title }}" maxlength="200" required><label class="form-label" for="content">Опис</label><textarea class="form-control mb-3" id="content" name="content" rows="7" required>{{ thread.content }}</textarea>{% if error %}<div class="text-danger mb-3">{{ error }}</div>{% endif %}<button class="btn btn-primary" type="submit">Зберегти</button></form>{% endblock %}
