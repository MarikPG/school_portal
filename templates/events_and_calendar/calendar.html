{% extends 'base.html' %}

{% block title %}Календар подій{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0">Календар подій</h1>
        <div>
            <a href="{% url 'events_and_calendar:event_list' %}" class="btn btn-outline-secondary me-2">Списком</a>
            <a href="{% url 'events_and_calendar:event_create' %}" class="btn btn-primary">+ Створити подію</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      firstDay: 1, 
      locale: 'uk',
      buttonText: {
        today: 'Сьогодні',
        month: 'Місяць',
        week: 'Тиждень'
      },
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek'
      },
      events: "{% url 'events_and_calendar:calendar_json' %}",
      eventClick: function(info) {
        if (info.event.url) {
          window.location.href = info.event.url + "?from=calendar";
          info.jsEvent.preventDefault();
        }
      }
    });
    calendar.render();
  });
</script>
{% endblock %}
