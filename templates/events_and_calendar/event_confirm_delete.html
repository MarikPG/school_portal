{% extends 'base.html' %}

{% block title %}Підтвердження видалення{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-danger border-0">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="bg-danger-subtle text-danger p-2 rounded-circle d-inline-flex align-items-center justify-content-center">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </div>
                        <h1 class="h5 card-title text-danger m-0 fw-bold">Видалити подію?</h1>
                    </div>

                    <p class="text-secondary mb-4">
                        Ви дійсно бажаєте видалити подію <strong>"{{ object.title }}"</strong>? Цю дію неможливо скасувати.
                    </p>

                    <form method="post" class="d-flex align-items-center gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            Так, видалити
                        </button>
                        <a href="{% url 'events_and_calendar:event_detail' object.pk %}" class="btn btn-outline-secondary">
                            Скасувати
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
